name: Build & Runtime Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static-checks:
    name: Typecheck, Lint, Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests (includes Appwrite smoke test)
        env:
          EXPO_PUBLIC_ENDPOINT: ${{ secrets.EXPO_PUBLIC_ENDPOINT }}
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_DATABASE_ID: ${{ secrets.EXPO_PUBLIC_DATABASE_ID }}
          EXPO_PUBLIC_USER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_USER_COLLECTION_ID }}
          EXPO_PUBLIC_REMINDER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_REMINDER_COLLECTION_ID }}
          EXPO_PUBLIC_STORAGE_ID: ${{ secrets.EXPO_PUBLIC_STORAGE_ID }}
        run: npm run test -- --ci

  android-emulator-check:
    name: Build & Boot on Android Emulator
    runs-on: ubuntu-latest
    needs: static-checks
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write .env for build
        env:
          EXPO_PUBLIC_ENDPOINT: ${{ secrets.EXPO_PUBLIC_ENDPOINT }}
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_DATABASE_ID: ${{ secrets.EXPO_PUBLIC_DATABASE_ID }}
          EXPO_PUBLIC_USER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_USER_COLLECTION_ID }}
          EXPO_PUBLIC_REMINDER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_REMINDER_COLLECTION_ID }}
          EXPO_PUBLIC_STORAGE_ID: ${{ secrets.EXPO_PUBLIC_STORAGE_ID }}
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_ENDPOINT=$EXPO_PUBLIC_ENDPOINT
          EXPO_PUBLIC_PLATFORM=$EXPO_PUBLIC_PLATFORM
          EXPO_PUBLIC_PROJECT_ID=$EXPO_PUBLIC_PROJECT_ID
          EXPO_PUBLIC_DATABASE_ID=$EXPO_PUBLIC_DATABASE_ID
          EXPO_PUBLIC_USER_COLLECTION_ID=$EXPO_PUBLIC_USER_COLLECTION_ID
          EXPO_PUBLIC_REMINDER_COLLECTION_ID=$EXPO_PUBLIC_REMINDER_COLLECTION_ID
          EXPO_PUBLIC_STORAGE_ID=$EXPO_PUBLIC_STORAGE_ID
          EOF

      # app.json's android.package MUST already match the platform
      # registered in Appwrite. This step fails loudly if someone
      # reverts that fix instead of silently shipping a broken build.
      - name: Verify app.json package matches EXPO_PUBLIC_PLATFORM
        run: |
          PKG=$(node -p "require('./app.json').expo.android.package")
          if [ "$PKG" != "$EXPO_PUBLIC_PLATFORM" ]; then
            echo "::error::app.json android.package ($PKG) does not match EXPO_PUBLIC_PLATFORM ($EXPO_PUBLIC_PLATFORM)"
            exit 1
          fi
        env:
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}

      - name: Free up disk space (pre-build)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          # NOTE: do NOT wipe /opt/hostedtoolcache wholesale — it's where
          # actions/setup-java and actions/setup-node install their
          # runtimes, which this workflow needs later. Only remove
          # specific subfolders we know we don't use.
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/PyPy
          df -h

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (with embedded JS bundle)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace -PreactNativeArchitectures=x86_64
        # No special env vars needed here — the withForceDebugBundle config
        # plugin (plugins/withForceDebugBundle.js, applied during
        # `expo prebuild`) already sets debuggableVariants = [] in
        # build.gradle, forcing the JS bundle to be embedded in the debug
        # APK. Confirmed locally: assets/index.android.bundle is present
        # in the built APK.

      - name: Free up disk space (post-build, pre-emulator)
        run: |
          df -h
          # Safe to remove: Gradle's own cache (already consumed for this
          # build) and the NDK (not needed for the emulator step). Do NOT
          # touch /opt/hostedtoolcache — Java/Node runtimes live there and
          # the emulator runner action depends on them.
          sudo rm -rf ~/.gradle/caches/
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h

      - name: Run on Android Emulator & capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.myatomikappz.placereminder -c android.intent.category.LAUNCHER 1
            sleep 4 && adb shell pidof com.myatomikappz.placereminder | tr -d '\r' > /tmp/pid1.txt
            sleep 4 && adb shell pidof com.myatomikappz.placereminder | tr -d '\r' > /tmp/pid2.txt
            sleep 4 && adb shell pidof com.myatomikappz.placereminder | tr -d '\r' > /tmp/pid3.txt
            sleep 4 && adb shell pidof com.myatomikappz.placereminder | tr -d '\r' > /tmp/pid4.txt
            sleep 4 && adb shell pidof com.myatomikappz.placereminder | tr -d '\r' > /tmp/pidfinal.txt
            echo "Final app PID check: $(cat /tmp/pidfinal.txt)"
            adb logcat -d > logcat_output.txt
            echo "--- Checking for fatal errors in OUR app only ---"
            if grep -q "com.myatomikappz.placereminder.*FATAL EXCEPTION\|Appwrite.*Exception" logcat_output.txt; then echo "::error::Fatal exception found in logcat" && exit 1; else echo "PASS: No fatal exceptions"; fi
            if [ ! -s /tmp/pidfinal.txt ]; then echo "::error::App process died before 20s" && exit 1; else echo "PASS: App still alive"; fi

      - name: Upload logcat (always, for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: logcat_output.txt