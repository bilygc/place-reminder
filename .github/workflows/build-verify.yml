name: Build & Runtime Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  static-checks:
    name: Typecheck, Lint, Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests (includes Appwrite smoke test)
        env:
          EXPO_PUBLIC_ENDPOINT: ${{ secrets.EXPO_PUBLIC_ENDPOINT }}
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_DATABASE_ID: ${{ secrets.EXPO_PUBLIC_DATABASE_ID }}
          EXPO_PUBLIC_USER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_USER_COLLECTION_ID }}
          EXPO_PUBLIC_REMINDER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_REMINDER_COLLECTION_ID }}
          EXPO_PUBLIC_STORAGE_ID: ${{ secrets.EXPO_PUBLIC_STORAGE_ID }}
        run: npm run test -- --ci

  android-emulator-check:
    name: Build & Boot on Android Emulator
    runs-on: ubuntu-latest
    needs: static-checks
    strategy:
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write .env for build
        env:
          EXPO_PUBLIC_ENDPOINT: ${{ secrets.EXPO_PUBLIC_ENDPOINT }}
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_DATABASE_ID: ${{ secrets.EXPO_PUBLIC_DATABASE_ID }}
          EXPO_PUBLIC_USER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_USER_COLLECTION_ID }}
          EXPO_PUBLIC_REMINDER_COLLECTION_ID: ${{ secrets.EXPO_PUBLIC_REMINDER_COLLECTION_ID }}
          EXPO_PUBLIC_STORAGE_ID: ${{ secrets.EXPO_PUBLIC_STORAGE_ID }}
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_ENDPOINT=$EXPO_PUBLIC_ENDPOINT
          EXPO_PUBLIC_PLATFORM=$EXPO_PUBLIC_PLATFORM
          EXPO_PUBLIC_PROJECT_ID=$EXPO_PUBLIC_PROJECT_ID
          EXPO_PUBLIC_DATABASE_ID=$EXPO_PUBLIC_DATABASE_ID
          EXPO_PUBLIC_USER_COLLECTION_ID=$EXPO_PUBLIC_USER_COLLECTION_ID
          EXPO_PUBLIC_REMINDER_COLLECTION_ID=$EXPO_PUBLIC_REMINDER_COLLECTION_ID
          EXPO_PUBLIC_STORAGE_ID=$EXPO_PUBLIC_STORAGE_ID
          EOF

      # app.json's android.package MUST already match the platform
      # registered in Appwrite. This step fails loudly if someone
      # reverts that fix instead of silently shipping a broken build.
      - name: Verify app.json package matches EXPO_PUBLIC_PLATFORM
        run: |
          PKG=$(node -p "require('./app.json').expo.android.package")
          if [ "$PKG" != "$EXPO_PUBLIC_PLATFORM" ]; then
            echo "::error::app.json android.package ($PKG) does not match EXPO_PUBLIC_PLATFORM ($EXPO_PUBLIC_PLATFORM)"
            exit 1
          fi
        env:
          EXPO_PUBLIC_PLATFORM: ${{ secrets.EXPO_PUBLIC_PLATFORM }}

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (with embedded JS bundle)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace -PreactNativeArchitectures=x86_64
        env:
          # Force JS bundling into the debug APK. By default React Native
          # skips this in debug builds and expects a live Metro server —
          # which doesn't exist in CI. Without this, the app installs fine
          # but crashes on launch with "Unable to load script."
          ORG_GRADLE_PROJECT_expo_useLegacyPackaging: "false"

      - name: Run on Android Emulator & capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            APP_PID=""
            adb shell monkey -p com.myatomikappz.placereminder -c android.intent.category.LAUNCHER 1
            sleep 5
            APP_PID=$(adb shell pidof com.myatomikappz.placereminder | tr -d '\r')
            echo "App PID: ${APP_PID:-not found}"
            sleep 20
            adb logcat -d > logcat_output.txt
            echo "--- Checking for fatal errors / crashes in our app only ---"
            # Only fail on a FATAL EXCEPTION whose logcat line is tagged with
            # our app's own PID, or that explicitly names our package/an
            # Appwrite exception. This avoids false positives from unrelated
            # system apps (e.g. com.google.android.gm) crashing in the
            # background on a bare CI emulator image, which is expected and
            # not something we want to gate the PR on.
            if [ -n "$APP_PID" ] && grep -E "FATAL EXCEPTION" logcat_output.txt | grep -q "$APP_PID"; then
              echo "::error::Fatal runtime error detected in our app (PID $APP_PID). See logcat_output.txt"
              grep -A 30 "FATAL EXCEPTION" logcat_output.txt | grep "$APP_PID" || true
              exit 1
            elif grep -E "com\.myatomikappz\.placereminder.*FATAL EXCEPTION|Appwrite.*Exception" logcat_output.txt; then
              echo "::error::Fatal runtime error detected referencing our app or Appwrite. See logcat_output.txt"
              exit 1
            else
              echo "No fatal exceptions detected in our app during smoke boot."
              echo "(Unrelated system-app crashes, if any, are ignored — see logcat_output.txt for full log.)"
            fi

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: logcat_output.txt